# =============================================
# Development compose - app on live source mount (nodemon), db on 3306
# Usage: docker compose -f docker-compose.dev.yml up
# =============================================
services:
  mysql:
    image: mysql:8.0
    container_name: hair_connect_db_dev
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hair_connect
      TZ: Asia/Jakarta
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    volumes:
      - db_data_dev:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306" # 3307 on host to avoid clashing with XAMPP's 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: backend-barberflow:dev-test
    container_name: hair_connect_app_dev
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # live source mount -> nodemon restarts on any change
      - ./src:/app/src
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: hair_connect
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  db_data_dev: